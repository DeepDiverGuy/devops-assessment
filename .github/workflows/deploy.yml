name: Deploy

on:
  workflow_run:
    workflows: ["Build and push"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-abc1234 or 1.0.0)"
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then tag="$INPUT_TAG"; else tag="sha-${HEAD_SHA::7}"; fi
          [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $tag"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find staging instance
        id: instance
        run: |
          set -euo pipefail
          read -r id ip < <(aws ec2 describe-instances \
            --filters Name=tag:Project,Values=devops-assessment Name=tag:Environment,Values=staging Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].[InstanceId,PublicIpAddress]' --output text)
          [ "$id" != "None" ] || { echo "No running staging instance"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM (smoke test and rollback run on the instance)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          set -euo pipefail
          cmd=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "{\"commands\":[\"/usr/local/bin/deploy.sh ${TAG}\"]}" \
            --query Command.CommandId --output text)
          status=0
          aws ssm wait command-executed --command-id "$cmd" --instance-id "$INSTANCE_ID" || status=1
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          exit "$status"

      - name: Verify from outside
        env:
          IP: ${{ steps.instance.outputs.ip }}
        run: |
          curl -fsS --retry 5 --retry-delay 3 "http://${IP}:8080/health"
          echo
          curl -fsS "http://${IP}:8080/"
          echo
