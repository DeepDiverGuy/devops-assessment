services:
  app:
    build:
      context: .
      args:
        APP_VERSION: "1.0.0"
    image: devops-task:local
    container_name: devops-task
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "INFO"
      ENVIRONMENT: "local"
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
